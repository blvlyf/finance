<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#faf8f4"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>The V Fi</title>
<link rel="stylesheet" href="style.css"></head><body>
<main id="app"></main><nav id="nav"></nav><div id="modal"></div><div id="dlg"></div>
<div id="lock" role="dialog" aria-modal="true" aria-label="The V Fi is locked"><div class="wm" id="lockwm"></div><p id="pinmsg" class="pm" role="alert"></p>
<div id="pinrow" class="lk"><input id="pin" type="password" autocomplete="current-password" placeholder="PIN" aria-label="PIN" onkeydown="if(event.key==='Enter')unlock()"><button class="btn pri" onclick="unlock()">Unlock</button></div>
<button id="bioBtn" class="btn" hidden onclick="bioGo()">Use fingerprint or face</button>
<label id="brk" class="btn" hidden>Restore a backup<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div>
<noscript>The V Fi needs JavaScript to run.</noscript>
<script src="core.js"></script><script src="store.js"></script><script src="ui.js"></script><script src="features.js"></script><script src="app.js"></script>
</body></html>
