<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f4"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>The V Fi</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--br);outline-offset:2px}
.wm{display:flex;align-items:flex-end;gap:6px;padding:22px 0 6px;font:15px/1 "Courier New",Courier,monospace;letter-spacing:.06em}.wm svg{height:34px;width:auto}

.hint{color:var(--mut);font-size:14px;margin:8px 0 0}.hint.neg{color:var(--neg)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:16px;font-size:14px;line-height:1.4;z-index:30;animation:up .35s cubic-bezier(.2,.9,.25,1)}.toast.out{opacity:0;transition:opacity .5s}
.dd{margin:6px 0 4px}.ddb{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:50px;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:var(--sf);font-size:17px}.ddb i{font-style:normal;font-size:20px;transition:transform .3s}.dd.open .ddb i{transform:rotate(180deg)}.dd.open .ddb{border-color:var(--br)}
.ddw{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}.dd.open .ddw{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1)}
.ddi{overflow:hidden;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}.dd.open .ddi{padding-top:10px}
.ddo{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:none;border-radius:12px;padding:11px 12px;min-height:46px;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s,background-color .2s}.dd.open .ddo{opacity:1;transform:none}.dd.open .ddo:nth-child(n+3){transition-delay:.04s}.dd.open .ddo:nth-child(n+5){transition-delay:.08s}.dd.open .ddo:nth-child(n+7){transition-delay:.12s}.dd.open .ddo:nth-child(n+9){transition-delay:.16s}
.ddo.on{background:var(--br);border-color:var(--br);color:var(--onbr);font-weight:600}.ddo.new{grid-column:1/-1;border-style:dashed;color:var(--br)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;min-height:48px;color:var(--mut);font-size:14px}nav button[aria-current]{color:var(--br);font-weight:700}
nav .plus{flex:0 0 56px;height:56px;border-radius:50%;background:var(--br);color:var(--onbr);font-size:30px;line-height:1;margin:0 6px}
#modal{display:none;position:fixed;inset:0;background:#0006;z-index:9;align-items:flex-end}#modal.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes inx{from{opacity:0;transform:translateX(var(--dx,0px))}}@keyframes grow{from{transform:scaleX(0)}}@keyframes fadein{from{opacity:0}}
#app.in{animation:inx .5s cubic-bezier(.2,.8,.2,1) both}#app.in .bar i{transform-origin:left;animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) both}#modal.on{animation:fadein .25s}
body,.hero,.row,.btn,.chip,nav,nav button,.sheet,input{transition:transform .2s,background-color .35s,border-color .35s,color .35s}.row:active,.chip:active,.btn:active{transform:scale(.97)}
nav::before{content:"";position:absolute;top:0;left:0;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--br);transform:translateX(calc(var(--x,-40px) - 14px));transition:transform .55s cubic-bezier(.3,1.3,.4,1)}
nav .plus{box-shadow:0 10px 22px -8px var(--br);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}nav .plus:active{transform:scale(.9) rotate(90deg)}
.pals{display:flex;gap:14px;margin:16px 0 4px}.pal{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);padding:0;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}.pal.on{outline:2px solid var(--br);outline-offset:3px;transform:scale(1.08)}
#lock{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;align-items:center;justify-content:center;flex-direction:column;gap:14px}#lock.on{display:flex}#lock input{width:180px;text-align:center;font-size:20px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="app"></main><nav id="nav"></nav><div id="modal"></div>
<div id="lock"><div class="wm" id="lockwm"></div><input id="pin" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN"><button class="btn pri" onclick="unlock()">Unlock</button></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,10);
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dstr(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f=x=>x.amt)=>a.reduce((s,x)=>s+(+f(x)||0),0),pc=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const DEF=()=>({set:{name:'',cur:'UGX',day:28,cash0:0,pin:'',bk:'',hi:0},tx:[],up:[],goals:[],debts:[],bud:{},cats:[],acc:[],split:{tithe:10,offer:5,save:40,give:15,live:30}});
const BASE=['Rent','Food','Transport','Utilities','Internet & data','Tithe','Offering','Family','Giving','Health','Education','Fun','Personal care','Other'],GV=['Tithe','Offering','Church & tithe','Family','Giving'],SRC=['Salary','Business','Freelance','Valuation','Graphic design','Music lessons','Gift','Loan','Other'],KN={exp:'Spent',inc:'Received',save:'Saved',debt:'Repaid'};
let S=DEF(),tab='home',sub='bud',sel=0,locked=false,qs='';
const num=n=>{const a=Math.round(Math.abs(n||0)*100)/100;return a.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})},fmt=n=>(n<0?'−':'')+S.set.cur+' '+num(n);
/* storage */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('vfi',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no});
const load=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
async function save(){render();const d=await idb();d.transaction('k','readwrite').objectStore('k').put(S,'s')}
/* months (a month starts on the payday you choose, default the 1st) */
const D=()=>Math.min(28,Math.max(1,+S.set.day||1));
const cyc=d=>{let[y,m,dd]=d.split('-').map(Number);if(dd<D()){m--;if(m<1){m=12;y--}}return y*12+m-1};
const cl=c=>{const k=D()>1?c+1:c;return new Date(Math.floor(k/12),k%12,1).toLocaleString('en',{month:'long',year:'numeric'})};
/* numbers */
const T=(k,c)=>S.tx.filter(t=>t.k===k&&(c==null||cyc(t.d)===c));
const cash=()=>+S.set.cash0+sum(T('inc'))-sum(T('exp'))-sum(T('save'))-sum(T('debt'));
const gS=g=>(+g.base||0)+sum(T('save').filter(x=>x.tgt===g.id)),saved=()=>sum(S.goals,g=>g.base)+sum(T('save'));
const dBal=d=>Math.max(0,d.amt-sum(T('debt').filter(x=>x.tgt===d.id))),owed=()=>sum(S.debts,dBal);
const BK=[['tithe','Tithe'],['offer','Offerings'],['save','Savings'],['give','Giving'],['live','Wants & needs']];
const bkOf=t=>t.k==='save'?'save':t.k==='debt'?'live':t.k!=='exp'?'':['Tithe','Church & tithe'].includes(t.cat)?'tithe':t.cat==='Offering'?'offer':['Giving','Family'].includes(t.cat)?'give':'live';
const incSplit=c=>sum(T('inc',c).filter(t=>t.cat!=='Loan')),bk=(c,id)=>{const al=incSplit(c)*(+S.split[id]||0)/100,used=sum(S.tx.filter(t=>cyc(t.d)===c&&bkOf(t)===id));return{al,used,left:al-used}};
const spentIn=(c,n)=>sum(T('exp',c).filter(t=>t.cat===n));
const aB=a=>(+a.base||0)+sum(S.tx.filter(t=>t.acc===a.id),t=>t.k==='inc'?t.amt:-t.amt),tot=()=>sum(S.acc,aB);
const hero=()=>{const n=S.acc.length,v=n?tot():cash(),sg=x=>(x<0?'−':'')+num(x);return`<div class=hero><div class=wmk>${mark}</div><div class=lab>${n?'Total money':'Available'}</div><div class=big><small>${esc(S.set.cur)}</small>${sg(v)}</div><div class=sub style="margin-top:6px">Net worth <b>${sg(v+saved()-owed())}</b> <span style="font-size:13px">(money + savings − debts)</span></div>${n?`<div style="margin-top:14px">${S.acc.map(x=>`<button class=ar onclick="setA('${x.id}')"><span>${esc(x.name)}</span><b>${sg(aB(x))}</b></button>`).join('')}</div><button class="btn sm" style="margin-top:12px" onclick="setA()">Add account</button>`:`<p class=sub style="margin-top:12px">Where is your money kept?</p><div class=chips>${['Mobile money','Smartlife','Bank','Cash'].map(x=>`<button class=chip onclick="setA(null,'${x}')">${x}</button>`).join('')}</div>`}</div>`};
const mark=`<svg viewBox="0 0 40 48" aria-hidden="true"><path d="M6 6 19 39q2 4 4 0L34 2" fill="none" stroke="var(--br)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 22v25M11 24h14" stroke="var(--ink)" stroke-width="1.2"/></svg>`;
const wm=`<span>THE</span>${mark}<span>FI</span>`;$('#lockwm').innerHTML=wm;
const head=()=>`<div class="wm" aria-label="The V Fi">${wm}</div>`;
const mn=c=>`<div class=mn><button onclick="sel--;render()" aria-label="Previous month">‹</button><span>${cl(c)}</span><button onclick="sel++;render()" aria-label="Next month">›</button></div>`;
const bar=(p,over)=>`<div class="bar ${over?'over':''}"><i style="width:${p}%"></i></div>`;
const li=t=>`<button class=row onclick="edit('${t.id}')"><div class=t><span>${esc(t.note||t.cat||KN[t.k])}</span><b class="${t.k==='inc'?'pos':''}">${t.k==='inc'?'+':'−'}${num(t.amt)}</b></div><div class=s>${t.d} · ${KN[t.k]}${t.cat?' · '+esc(t.cat):''}</div></button>`;
const hi=()=>{const h=new Date().getHours();return(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+(S.set.name?', '+esc(S.set.name):'')},empty=(a,b,x)=>`<div class=empty><b>${a}</b>${b}${x?`<div class=chips style="justify-content:center;margin-top:16px">${x}</div>`:''}</div>`;
/* views */
function home(){const c=sel,I=sum(T('inc',c)),X=sum(T('exp',c)),gv=sum(T('exp',c).filter(t=>GV.includes(t.cat))),sv=saved(),od=owed(),bs=Object.keys(S.bud),mt=S.tx.filter(t=>cyc(t.d)===c).sort((a,b)=>a.d<b.d?1:-1);
return head()+`<h2 class=hi>${hi()}</h2><p class=sub>${S.tx.length?(I-X>0?'You have kept '+fmt(I-X)+' this month.':'Here is where this month stands.'):'Ready when you are.'}</p>`+mn(c)+`${hero()}`+
(S.tx.length?`<div class=pair><div><span>Spent today</span><b>${num(sum(T('exp').filter(t=>t.d===today())))}</b></div><div><span>Received</span><b class=pos>${num(I)}</b></div><div><span>Spent</span><b>${num(X)}</b></div>${gv>0?`<div><span>Given</span><b>${num(gv)}</b></div>`:''}${sv>0?`<div><span>Saved</span><b>${num(sv)}</b></div>`:''}${od>0?`<div><span>Owed</span><b class=neg>${num(od)}</b></div>`:''}</div>`:'')+
(incSplit(c)>0?`<div class=lab>Your split</div>`+BK.map(([k,n])=>{const x=bk(c,k);return`<div style="padding:6px 0"><div style="display:flex;justify-content:space-between"><span>${n}</span><span style="font-size:14px;color:${x.left<0?'var(--neg)':'var(--mut)'}">${x.left<0?num(-x.left)+' over':num(x.left)+' left'}</span></div>${bar(pc(x.used,x.al),x.left<0)}</div>`}).join(''):'')+
repBanner()+(pendUp().length?`<div class=lab>Upcoming</div>`+pendUp().slice(0,3).map(u=>`<div style="padding:6px 0;display:flex;justify-content:space-between"><span>${esc(u.what)} <span class=s>· ${when(u)}</span></span><b>${num(u.amt)}</b></div>`).join(''):'')+
(bs.length?`<div class=lab>Budgets</div>`+bs.map(n=>{const b=+S.bud[n],a=spentIn(c,n);return`<div style="padding:8px 0"><div class=t style="display:flex;justify-content:space-between"><span>${esc(n)}</span><span class="s ${a>b?'neg':''}" style="font-size:14px">${a>b?num(a-b)+' over':num(b-a)+' left'}</span></div>${bar(pc(a,b),a>b)}</div>`}).join(''):'')+
(S.goals.length?`<div class=lab>Goals</div>`+S.goals.map(g=>`<div style="padding:8px 0"><div style="display:flex;justify-content:space-between"><span>${esc(g.name)}</span><span style="font-size:14px;color:var(--mut)">${g.target?(pc(gS(g),g.target)>=100?'Reached':pc(gS(g),g.target)+'%'):num(gS(g))}</span></div>${g.target?bar(pc(gS(g),g.target)):''}</div>`).join(''):'')+
(mt.length?`<div class=lab>Recent</div>`+mt.slice(0,5).map(li).join(''):'')+
(!S.tx.length&&!+S.set.cash0?empty('Your money, your story','Tap + to add your first entry. Nothing is pre-filled, so every number here will be one you entered.'):'')}
function act(){const c=sel,f=S.tx.filter(t=>cyc(t.d)===c&&(!qs||(t.note+t.cat+KN[t.k]).toLowerCase().includes(qs.toLowerCase()))).sort((a,b)=>a.d<b.d?1:-1);
return head()+mn(c)+`<div class=acts style="margin:4px 0 12px"><button class="btn sm" onclick="report('week')">Weekly report</button><button class="btn sm" onclick="report('month')">Monthly report</button></div>`+(S.tx.length>6?`<input placeholder="Search" aria-label="Search entries" value="${esc(qs)}" onchange="qs=this.value;render()">`:'')+(f.map(li).join('')||empty('Nothing yet','No entries in this month.'))}
