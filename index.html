<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,10);
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dstr(new Date());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f=x=>x.amt)=>a.reduce((s,x)=>s+(+f(x)||0),0),pc=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
const DEF=()=>({set:{name:'',cur:'UGX',day:28,cash0:0,pin:'',bk:'',hi:0},tx:[],up:[],todo:[],hab:[],jr:{},goals:[],debts:[],bud:{},cats:[],acc:[],split:{tithe:10,offer:5,save:40,give:15,live:30}});
const BASE=['Rent','Food','Transport','Utilities','Internet & data','Tithe','Offering','Family','Giving','Health','Education','Fun','Personal care','Other'],GV=['Tithe','Offering','Church & tithe','Family','Giving'],SRC=['Salary','Business','Freelance','Valuation','Graphic design','Music lessons','Gift','Loan','Other'],KN={exp:'Spent',inc:'Received',save:'Saved',debt:'Repaid'};
let S=DEF(),tab='dayv',sub='bud',sel=0,locked=false,qs='';
const num=n=>{const a=Math.round(Math.abs(n||0)*100)/100;return a.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})},fmt=n=>(n<0?'−':'')+S.set.cur+' '+num(n);
/* storage */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('vfi',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no});
const load=async()=>{const d=await idb();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
async function save(){render();const d=await idb();d.transaction('k','readwrite').objectStore('k').put(S,'s')}
/* months (a month starts on the payday you choose, default the 1st) */
const D=()=>Math.min(28,Math.max(1,+S.set.day||1));
const cyc=d=>{let[y,m,dd]=d.split('-').map(Number);if(dd<D()){m--;if(m<1){m=12;y--}}return y*12+m-1};
const cl=c=>{const k=D()>1?c+1:c;return new Date(Math.floor(k/12),k%12,1).toLocaleString('en',{month:'long',year:'numeric'})};
/* numbers */
const T=(k,c)=>S.tx.filter(t=>t.k===k&&(c==null||cyc(t.d)===c));
const cash=()=>+S.set.cash0+sum(T('inc'))-sum(T('exp'))-sum(T('save'))-sum(T('debt'));
const gS=g=>(+g.base||0)+sum(T('save').filter(x=>x.tgt===g.id)),saved=()=>sum(S.goals,g=>g.base)+sum(T('save'));
const dBal=d=>Math.max(0,d.amt-sum(T('debt').filter(x=>x.tgt===d.id))),owed=()=>sum(S.debts,dBal);
const BK=[['tithe','Tithe'],['offer','Offerings'],['save','Savings'],['give','Giving'],['live','Wants & needs']];
const bkOf=t=>t.k==='save'?'save':t.k==='debt'?'live':t.k!=='exp'?'':['Tithe','Church & tithe'].includes(t.cat)?'tithe':t.cat==='Offering'?'offer':['Giving','Family'].includes(t.cat)?'give':'live';
const incSplit=c=>sum(T('inc',c).filter(t=>t.cat!=='Loan')),bk=(c,id)=>{const al=incSplit(c)*(+S.split[id]||0)/100,used=sum(S.tx.filter(t=>cyc(t.d)===c&&bkOf(t)===id));return{al,used,left:al-used}};
const spentIn=(c,n)=>sum(T('exp',c).filter(t=>t.cat===n));

M.onclick=ev=>{if(ev.target===M)return mclose();const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.i!==undefined){items[+d.i].on=items[+d.i].on?0:1;draw();return}if(d.g!==undefined){gid=d.g;draw();return}
if(d.x==='skip')mclose();if(d.x==='edit'){mclose();setSplit()}
if(d.x==='ok'){const on=items.filter(x=>x.on);on.forEach(x=>{if(x.k==='save'){if(!S.goals.length){const g={id:uid(),name:'Savings',target:'',base:0};S.goals.push(g);gid=g.id}S.tx.push({id:uid(),k:'save',d:t.d,amt:x.a,cat:'',note:'From income split',tgt:gid,acc:t.acc||''})}else S.tx.push({id:uid(),k:'exp',d:t.d,amt:x.a,cat:x.k==='tithe'?'Tithe':x.k==='offer'?'Offering':'Giving',note:'From income split',tgt:'',acc:t.acc||''})});mclose();save();if(on.length)toast('Set aside '+fmt(sum(on,x=>x.a)))}};
draw()}
/* close the month */
function closeMonth(c){const I=sum(T('inc',c).filter(t=>t.cat!=='Loan')),X=sum(T('exp',c)),kept=Math.round((I-X)*100)/100,bs=Object.keys(S.bud).map(n=>({n,l:lim(n,c),a:spentIn(c,n)})),was=(S.closed||{})[c],ba=S.acc.length?S.acc.filter(a=>aB(a)>=kept).sort((a,b)=>aB(b)-aB(a))[0]:null,can=kept>0&&S.goals.length>0&&(S.acc.length?!!ba:cash()>=kept),v={carry:1,gid:''};
const draw=()=>{M.innerHTML=`<div class=sheet role=dialog aria-label="Close month"><h3>Close ${cl(c)}</h3>${was?`<p class=hint style="margin:0 0 8px">Closed on ${was.at}. Closing again replaces the carry-over.</p>`:''}<div class=pair style="margin:0 0 10px"><div><span>Received</span><b>${fmt(I)}</b></div><div><span>Spent</span><b>${fmt(X)}</b></div><div><span>Kept</span><b class="${kept<0?'neg':'pos'}">${fmt(kept)}</b></div></div>${bs.length?`<div class=lab style="margin:10px 0 2px">Budgets</div>${bs.map(x=>`<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${esc(x.n)}</span><span class="${x.a>x.l?'neg':'pos'}">${x.a>x.l?num(x.a-x.l)+' over':num(x.l-x.a)+' left'}</span></div>`).join('')}<div class=chips style="margin-top:8px"><button type=button class="chip${v.carry?' on':''}" data-t=carry>Carry into ${cl(c+1)}</button></div><p class=hint>Leftover is added to next month's limits. Overspending is taken off them.</p>`:''}${can?`<div class=lab style="margin:14px 0 2px">Move ${fmt(kept)} to savings?</div><div class=chips><button type=button class="chip${v.gid?'':' on'}" data-g="">Not now</button>${S.goals.map(g=>`<button type=button class="chip${v.gid===g.id?' on':''}" data-g="${g.id}">${esc(g.name)}</button>`).join('')}</div>`:''}<div class=acts><button class=btn data-x=cancel>Cancel</button><button class="btn pri" data-x=ok>Close month</button></div></div>`;M.classList.add('on')};
M.onclick=ev=>{if(ev.target===M)return mclose();const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.t==='carry'){v.carry=v.carry?0:1;draw();return}if(d.g!==undefined){v.gid=d.g;draw();return}
if(d.x==='cancel')mclose();
if(d.x==='ok'){S.closed=S.closed||{};S.closed[c]={at:today(),inc:I,exp:X};S.carry=S.carry||{};
if(v.carry&&bs.length){const m={};bs.forEach(x=>{const r=Math.round(x.l-x.a);if(r)m[x.n]=r});S.carry[c+1]=m}else delete S.carry[c+1];
if(v.gid&&can){const dt=today()<cEn(c)?today():cEn(c);S.tx.push({id:uid(),k:'save',d:dt,amt:kept,cat:'',note:'Kept in '+cl(c),tgt:v.gid,acc:ba?ba.id:''})}
mclose();save();toast('Closed '+cl(c)+(v.carry&&bs.length?'. Budgets carried into '+cl(c+1)+'.':'.'))}};
draw()}

if(bdK&&$('#bd'))bd(bdK);$('#nav').innerHTML=[['dayv','Today'],['home','Money'],0,['calv','Calendar'],['sett','Settings']].map(x=>x?`<button ${(x[0]==='home'?['home','act','plan'].includes(tab):tab===x[0])?'aria-current=page':''} onclick="go('${x[0]}')">${x[1]}</button>`:'<button class=plus onclick="plus()" aria-label="Add">+</button>').join('');flow()}
