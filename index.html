<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const fmt=n=>(n<0?'-':'')+'UGX '+Math.round(Math.abs(n||0)).toLocaleString('en-US');

const DEF=()=>({set:{salary:700000,payday:28,start:'2026-11-28',cash0:0,pin:'',lastBackup:''},tx:[],

/* cycles */
const PD=()=>Math.min(28,+S.set.payday||28),cyc=d=>{let[y,m,dd]=d.split('-').map(Number);if(dd<PD()){m--;if(m<1){m=12;y--}}return y*12+m-1};
const cs=c=>`${Math.floor(c/12)}-${pad(c%12+1)}-${pad(PD())}`,ce=c=>{const d=new Date(cs(c+1)+'T00:00:00');d.setDate(d.getDate()-1);return dstr(d)};

const cycles=()=>range(sC(),Math.max(sel,sC())).slice(0,12);
/* calculations */
const T=(k,c)=>S.tx.filter(t=>t.k===k&&(c==null||cyc(t.d)===c));
const catA=(c,n)=>sum(T('exp',c).filter(t=>t.cat===n)),bud=n=>+S.budget[n]||0;

const savAt=c=>{const f=a=>a.filter(t=>cyc(t.d)<=c);return sum(S.goals,g=>g.base)+sum(S.plan,p=>p.base)+sum(f(T('save')))-sum(f(T('exp')),t=>t.fs)};
const sv=id=>sum(T('save').filter(x=>x.tgt===id)),gS=g=>(+g.base||0)+sv(g.id),pS=p=>(+p.base||0)+sv(p.id);
const dPaid=d=>sum(T('debt').filter(x=>x.tgt===d.id)),dBal=d=>Math.max(0,d.orig-dPaid(d)),debt=()=>sum(S.debts,dBal);

const left=d=>Math.max(1,cyc(d)-nowC()),need=(tgt,sd,d)=>tgt>0&&d?Math.max(0,tgt-sd)/left(d):0;

function adv(){const o=[],c=sel,A=(t,m)=>o.push([t,m]);
E.forEach(n=>{const b=bud(n)+carry(n),a=catA(c,n);if(bud(n)&&a>b)A('warn',`${n} spending (${fmt(a)}) is above its budget (${fmt(b)}) this cycle.`);else if(bud(n)&&a>b*.85)A('info',`${n} has used ${Math.round(a/b*100)}% of its budget.`)});

/* ui helpers */

const sh=c=>cl(c).slice(0,3);
function form(title,fields,vals,ok,del){const m=$('#modal');let v={...vals};const draw=()=>{const fs=typeof fields==='function'?fields(v):fields;

`<div class="row np" style="margin:12px"><button class=btn onclick="csv()">Export CSV</button><button class=btn onclick="print()">Print / PDF</button></div>`}

const SETS={'Payday (28th)':['Record salary','Allocate money','Fund rent, food, transport','Review debt repayments','Allocate savings and giving','Fund upcoming commitments'],Weekly:['Review expenses','Check remaining budgets','Review planned purchases','Spot unnecessary spending'],Monthly:['Close the salary cycle','Budget vs actual','Review savings','Review debts','Update future commitments'],Quarterly:['Review growth','Review investments','Evaluate net worth','Adjust goals'],Annual:['Generate annual report','Set new goals']};
const dueSets=()=>{const d=new Date(),k=[],e=ce(nowC());if(Math.abs(d.getDate()-PD())<=1)k.push('Payday (28th)');if(d.getDay()===0)k.push('Weekly');if((new Date(e)-d)/864e5<=3)k.push('Monthly');if((nowC()-sC()+1)%3===0&&(new Date(e)-d)/864e5<=3)k.push('Quarterly');if(nowC()-sC()>=11&&(new Date(e)-d)/864e5<=7)k.push('Annual');return k};
